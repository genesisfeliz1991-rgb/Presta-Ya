<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrestaYa PRO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- LOGIN -->
    <div id="login">
      <h1>💰 PrestaYa</h1>
      <input type="email" id="email" placeholder="Correo">
      <input type="password" id="password" placeholder="Contraseña">
      <button onclick="login()">Entrar</button>
      <button onclick="registrar()">Registrarme</button>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="main" style="display:none;">
      <h2>Bienvenido <span id="userEmail"></span> <button onclick="logout()">Salir</button></h2>
      
      <h3>Nuevo Préstamo</h3>
      <form id="formPrestamo">
        <input type="text" id="nombreCliente" placeholder="Nombre Cliente" required>
        <input type="number" id="monto" placeholder="Monto RD$" required>
        <select id="plazoTipo">
          <option value="diario">Diario</option>
          <option value="semanal">Semanal</option>
          <option value="mensual">Mensual</option>
        </select>
        <input type="number" id="plazo" placeholder="Cantidad de cuotas" required>
        <button type="submit">Guardar Préstamo</button>
        <button type="button" onclick="imprimir()">🖨️ Imprimir Recibo</button>
      </form>

      <h3>Clientes y Préstamos</h3>
      <table id="tablaPrestamos"></table>
    </div>
  </div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
