<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrestaYa PRO</title>
  <link rel="stylesheet" href="estilo.css?v=5">
</head>
<body>
  <div id="app">
    <div id="login">
      <div class="login-card">
        <h1>💰 PrestaYa</h1>
        <input type="email" id="email" placeholder="Correo" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <div class="botones-login">
          <button class="btn btn-azul" onclick="login()">Entrar</button>
          <button class="btn btn-celeste" onclick="registrar()">Registrarme</button>
        </div>
      </div>
    </div>

    <div id="main" style="display:none;">
      <header>
        <span>Usuario: <b id="userEmail"></b></span>
        <button class="btn-salir" onclick="logout()">Salir</button>
      </header>

      <h2>⚙️ Configurar Tasas</h2>
      <div class="card-tasas">
        <label>Diario %: <input type="number" id="tasaDiaria" step="0.1" value="3"></label>
        <label>Semanal %: <input type="number" id="tasaSemanal" step="0.1" value="15"></label>
        <label>Mensual %: <input type="number" id="tasaMensual" step="0.1" value="25"></label>
        <button class="btn btn-azul" onclick="guardarTasas()">Guardar Tasas</button>
      </div>

      <h2>Nuevo Préstamo</h2>
      <form id="formPrestamo">
        <input type="text" id="nombreCliente" placeholder="Nombre Cliente" required>
        <input type="number" id="monto" placeholder="Monto RD$" required>
        <select id="plazoTipo" required>
          <option value="">Tipo de Préstamo</option>
          <option value="diario">Diario</option>
          <option value="semanal">Semanal</option>
          <option value="mensual">Mensual</option>
        </select>
        <input type="number" id="plazo" placeholder="Cantidad de cuotas/tiempo" required>
        <button type="submit" class="btn btn-verde">Guardar Préstamo</button>
      </form>

      <h2>Clientes y Préstamos</h2>
      <table id="tablaPrestamos"></table>
    </div>
  </div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- TU CODIGO -->
  <script src="script.js?v=5"></script>
</body>
</html>
